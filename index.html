<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dress to Impress — seasons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Creepster&family=Rozha+One&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">
  <div id="sparkles" aria-hidden="true"></div>

  <header id="hud" hidden></header>

  <!-- TITLE -->
  <section id="scr-title" class="screen">
    <div class="title-wrap">
      <div class="logo">
        <span class="logo-small">✨ fan-made ✨</span>
        <h1>Dress to <em>Impress</em></h1>
        <div class="logo-seasons"><span class="ls ls-spooky">🎃 Spooky Season</span><span class="ls ls-nav">🪔 Navaratri</span><span class="ls ls-pass">💅 Baddie Pass</span><span class="ls ls-brat brat-font">brat</span></div>
      </div>
      <div id="title-models" class="title-models"></div>
      <form id="name-form" class="name-form" autocomplete="off">
        <label for="name-input">Pick your model name</label>
        <input id="name-input" maxlength="18" placeholder="e.g. lime_lover">
        <button class="btn big primary" type="submit">Play ▶</button>
      </form>
    </div>
  </section>

  <!-- MENU -->
  <section id="scr-menu" class="screen" hidden>
    <div id="menu-grid" class="menu-grid"></div>
    <div id="menu-stats" class="menu-stats"></div>
  </section>

  <!-- LOBBY -->
  <section id="scr-lobby" class="screen" hidden>
    <div class="lobby">
      <div class="lobby-head">
        <div class="lobby-sub" id="lobby-sub">Round starting…</div>
        <div class="theme-spin"><span class="ts-label">THE THEME IS</span><div id="theme-spin" class="ts-name">???</div><div id="theme-spin-desc" class="ts-desc"></div></div>
      </div>
      <div id="lobby-players" class="lobby-players"></div>
      <button id="btn-start-dress" class="btn big primary" hidden>Start dressing! 👗</button>
    </div>
  </section>

  <!-- DRESSING ROOM -->
  <section id="scr-dress" class="screen" hidden>
    <div class="dress-top">
      <div class="theme-card">
        <div class="theme-label" id="dress-theme-label">THEME</div>
        <div id="dress-theme" class="theme-name"></div>
        <div id="dress-theme-desc" class="theme-desc"></div>
      </div>
      <div id="dress-timer" class="timer">3:00</div>
      <div class="dress-actions">
        <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button class="btn" id="btn-random">🎲 Random</button>
        <button class="btn" id="btn-reset">🧼 Reset</button>
        <button class="btn" id="btn-outfits">💾 Outfits</button>
        <button class="btn" id="btn-photo">📸 Photo</button>
        <button class="btn primary" id="btn-ready">✔ Ready!</button>
        <button class="btn" id="btn-leave" title="Back to menu">🏠</button>
      </div>
    </div>
    <div class="dress-main">
      <nav id="cats" class="cats"></nav>
      <div class="stage-wrap">
        <div id="others" class="others"></div>
        <div id="preview" class="preview"></div>
        <div class="zoom-btns"><button class="btn small" id="btn-zoom">🔍 Zoom face</button></div>
      </div>
      <aside class="panel">
        <div id="grid" class="grid-wrap"></div>
        <div id="custom" class="custom"></div>
      </aside>
    </div>
  </section>

  <!-- RUNWAY -->
  <section id="scr-runway" class="screen" hidden>
    <div class="runway-stage" id="stage">
      <div class="stage-bg"></div>
      <div class="brat-wall brat-font" aria-hidden="true">brat</div>
      <div class="moon" aria-hidden="true"></div><div class="bats" aria-hidden="true"><i>🦇</i><i>🦇</i><i>🦇</i><i>🦇</i></div><div class="fog" aria-hidden="true"></div>
      <div class="toran" aria-hidden="true"></div><div class="diyas" aria-hidden="true"><i>🪔</i><i>🪔</i><i>🪔</i><i>🪔</i><i>🪔</i><i>🪔</i></div>
      <div class="lights"><i></i><i></i><i></i><i></i></div>
      <div class="runway-floor"></div>
      <div class="runway-top">
        <div class="theme-pill" id="rw-theme"></div>
        <div class="rw-progress" id="rw-progress"></div>
        <button class="btn small" id="btn-skip">⏩ Faster</button>
      </div>
      <div id="walker" class="walker"></div>
      <div class="flash" id="flash"></div>
      <div id="reactions" class="reactions"></div>
      <div class="nameplate" id="rw-name"></div>
      <div class="rw-bottom">
        <div id="vote" class="vote" hidden></div>
        <div id="poser" class="poser" hidden></div>
      </div>
      <div class="crowd" aria-hidden="true"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="scr-results" class="screen" hidden>
    <div id="results" class="results"></div>
  </section>

  <!-- SEASONAL EVENT HUB -->
  <section id="scr-event" class="screen" hidden>
    <div id="event-hub" class="ev-hub"></div>
  </section>

  <!-- BADDIE PASS -->
  <section id="scr-pass" class="screen" hidden>
    <div id="pass" class="pass"></div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>

  <script src="items.js"></script>
  <script src="game.js"></script>
</body>
</html>
